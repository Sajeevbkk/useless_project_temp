services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mood_ai_backend
    ports:
      - "5098:5098"
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=5098
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mood_ai_frontend
    ports:
      - "8097:8097"
    depends_on:
      - backend
    restart: unless-stopped
